<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login con Clave Estática</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <section class="login-container">
      <div class="login-box">
        <h2 class="local-font">Acceso Restringido</h2>

        <form onsubmit="return validarLogin(event);">
          <div class="input-group">
            <label class="local-font" for="email"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2zm-2 0l-8 5l-8-5zm0 12H4V8l8 5l8-5z"/></svg> Email</label>
            <input
              class="local-font"
              type="email"
              id="email"
              name="email"
              placeholder="Introduce tu email"
              required
            />
          </div>

          <div class="input-group">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path fill="currentColor" d="M21 2a8.998 8.998 0 0 0-8.612 11.612L2 24v6h6l10.388-10.388A9 9 0 1 0 21 2m0 16a7 7 0 0 1-2.032-.302l-1.147-.348l-.847.847l-3.181 3.181L12.414 20L11 21.414l1.379 1.379l-1.586 1.586L9.414 23L8 24.414l1.379 1.379L7.172 28H4v-3.172l9.802-9.802l.848-.847l-.348-1.147A7 7 0 1 1 21 18"/><circle cx="22" cy="10" r="2" fill="currentColor"/></svg>
            <label class="local-font" for="password"> Clave de Acceso (ok)</label>
            <input
              class="local-font"
              type="password"
              id="password"
              name="password"
              placeholder="Introduce la clave secreta"
              required
            />
          </div>

          <button type="submit" class="login-button local-font">Iniciar Sesión</button>
        </form>
      </div>
    </section>

    <script src="login.js"></script>
  </body>
</html>
